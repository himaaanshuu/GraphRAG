version: "3.9"

services:
  # Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graphrag-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/graphrag
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4j
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=openai
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=all-miniLM-L6-v2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - CORS_ORIGINS=["http://localhost:5173"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Application
  frontend:
    image: node:20-alpine
    container_name: graphrag-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--",--host"]

  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:0.2.0-pg15
    container_name: graphrag-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=graphrag
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Knowledge Graph
  neo4j:
    image: neo4j:5
    container_name: graphrag-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/neo4j
      - NEO4J_dbms_connector_bolt_advertised_address=localhost:7687
      - NEO4J_dbms_memory_heap_size=1g
      - NEO4J_dbms_storage_directory=/data/db
      - NEO4J_dbms_logs_path=/data/logs
    ports:
      - "7687:7687"  # Bolt
      - "7474:7474"  # HTTP API
      - "7473:7473"  # Browser
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7479/pricing/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: graphrag-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  redis_data: